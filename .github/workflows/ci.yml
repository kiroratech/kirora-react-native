name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:
    inputs:
      native_sdk_ref:
        description: Branch, tag or commit of kirora-android (default main), and of kirora-ios instead of the bundled copy (default none)
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Android job builds kirora-android from its repo. iOS builds the kirora-ios copy bundled in
  # ios/vendor, unless a run asks for another ref.
  NATIVE_SDK_REF: ${{ inputs.native_sdk_ref || 'main' }}

jobs:
  js:
    name: TypeScript and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Also builds the package (its `prepare` script).
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      - name: The bundled kirora-ios matches its tag
        run: scripts/check-bundled-ios.sh
      - name: Release plan tests
        run: node --test scripts/release-plan.test.mjs

  android:
    name: Android (e2e-app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kiroratech/kirora-android
          ref: ${{ env.NATIVE_SDK_REF }}
          path: kirora-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e-app/package-lock.json
      - name: Publish the Kirora Android SDK to Maven Local
        working-directory: kirora-android
        run: ./gradlew :kirora-sdk:publishToMavenLocal :kirora-sdk-push:publishToMavenLocal
      - run: npm ci
      - name: Install the e2e app
        working-directory: e2e-app
        run: npm ci
      # Robolectric downloads the Android runtime the bridge tests use (@Config(sdk = [34])) on
      # first use, and fails the tests if that download breaks. Keep it between runs, and fetch it
      # with retries when it isn't there. Update the name if the Robolectric version or SDK changes.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.17-sdk-34
      - name: Fetch Robolectric's Android 14 runtime
        run: |
          name=android-all-instrumented-14-robolectric-10818077-i7
          dir=~/.m2/repository/org/robolectric/android-all-instrumented/14-robolectric-10818077-i7
          url=https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/14-robolectric-10818077-i7
          mkdir -p "$dir"
          for file in "$name.pom" "$name.pom.sha512" "$name.jar" "$name.jar.sha512"; do
            [ -s "$dir/$file" ] || curl -fsSL --retry 5 --retry-all-errors -o "$dir/$file" "$url/$file"
          done
          echo "$(cat "$dir/$name.jar.sha512")  $dir/$name.jar" | sha512sum -c -
      - name: Build the e2e app (compiles the module) and run the bridge unit tests
        working-directory: e2e-app/android
        # One ABI is enough to prove the module compiles.
        run: ./gradlew :app:assembleDebug :kirora_react-native:testDebugUnitTest -PreactNativeArchitectures=x86_64
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            e2e-app/android/**/build/reports/
            android/build/reports/
            android/build/test-results/

  ios:
    name: iOS (e2e-app)
    # macOS minutes cost ten times more: only once the cheap checks pass.
    needs: js
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: inputs.native_sdk_ref
        with:
          repository: kiroratech/kirora-ios
          ref: ${{ env.NATIVE_SDK_REF }}
          path: kirora-ios
      - name: Bundle the requested kirora-ios
        if: inputs.native_sdk_ref
        run: scripts/sync-kirora-ios.sh kirora-ios
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e-app/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: e2e-app
          bundler-cache: true
      - run: npm ci
      - name: Install the e2e app
        working-directory: e2e-app
        run: npm ci
      - name: Install pods
        working-directory: e2e-app/ios
        env:
          # React Native's prebuilt core, instead of compiling it on every run.
          RCT_USE_PREBUILT_RNCORE: 1
          RCT_USE_RN_DEP: 1
        run: bundle exec pod install
      - name: Build the e2e app for the simulator (compiles the module)
        working-directory: e2e-app/ios
        run: |
          xcodebuild build \
            -workspace KiroraExample.xcworkspace \
            -scheme KiroraExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1 || { grep -E 'error:' xcodebuild.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log
          path: e2e-app/ios/xcodebuild.log
