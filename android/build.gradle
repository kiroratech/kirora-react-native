def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace 'io.kirora.reactnative'
  compileSdk safeExtGet('compileSdkVersion', 35)

  defaultConfig {
    minSdk safeExtGet('minSdkVersion', 24)
    consumerProguardFiles 'consumer-rules.pro'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }

  testOptions {
    unitTests.includeAndroidResources = true
  }
}

// React Native's Gradle plugin (0.74+) may raise Java to 17: Kotlin follows whatever Java level the
// module ends up with, or the build fails with "Inconsistent JVM Target Compatibility".
afterEvaluate {
  android.kotlinOptions.jvmTarget = android.compileOptions.targetCompatibility.toString()
}

repositories {
  google()
  mavenCentral()
}

def kiroraSdkVersion = safeExtGet('kiroraAndroidSdkVersion', '0.1.0')

dependencies {
  implementation 'com.facebook.react:react-android'
  // The core SDK, and the Firebase side of push (FCM service, notification permission).
  api "io.kirora:android-sdk:${kiroraSdkVersion}"
  implementation "io.kirora:android-sdk-push:${kiroraSdkVersion}"

  // KiroraSdkModuleTest: run from a host app build, which supplies react-android.
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'androidx.test:core:1.7.0'
  testImplementation 'org.robolectric:robolectric:4.17'
  testImplementation 'org.mockito:mockito-core:5.14.2'
}
